<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>천 마리 학</title>
<style>
@font-face{font-family:"Gowun Batang";src:url(fonts/GowunBatang-Bold.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url(fonts/GowunDodum-Regular.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Nanum Pen Script";src:url(fonts/NanumPenScript-Regular.woff2) format("woff2");font-display:swap}
/* Layout: one-column phone app — glass jar is the hero, paper stack + actions below, folding happens in a full-screen sheet */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --ink:#22253A; --muted:#6B6F86; --line:#D9DCE6;
  --accent:#3E55C4; --accent-ink:#FFFFFF; --label:#FBF7EC; --label-ink:#3A3428; --lid:#B8946A;
  --glass:rgba(140,160,200,.10); --glass-edge:rgba(60,75,120,.42); --shine:rgba(255,255,255,.55);
  --display:"Gowun Batang", "Noto Serif KR", serif;
  --body:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --hand:"Nanum Pen Script", "Gowun Dodum", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151E; --surface:#1E2030; --ink:#E9EAF3; --muted:#9A9EB8; --line:#2E3146;
  --accent:#8D9CFF; --accent-ink:#121426; --label:#EDE6D3; --label-ink:#2E2920; --lid:#8C6E4E;
  --glass:rgba(160,180,230,.07); --glass-edge:rgba(190,200,240,.40); --shine:rgba(255,255,255,.16); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14151E; --surface:#1E2030; --ink:#E9EAF3; --muted:#9A9EB8; --line:#2E3146;
  --accent:#8D9CFF; --accent-ink:#121426; --label:#EDE6D3; --label-ink:#2E2920; --lid:#8C6E4E;
  --glass:rgba(160,180,230,.07); --glass-edge:rgba(190,200,240,.40); --shine:rgba(255,255,255,.16); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:420px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}

.jarwrap{position:relative;width:min(100%,340px);margin:0 auto;aspect-ratio:300/450}
.jarwrap canvas{width:100%;height:100%;display:block}
.label{position:absolute;left:50%;top:34%;transform:translateX(-50%) rotate(-2.5deg);width:58%;
  background:var(--label);color:var(--label-ink);padding:10px 14px 12px;border-radius:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.12);text-align:center;pointer-events:none}
.label::before{content:"";position:absolute;inset:4px;border:1px dashed rgba(90,80,60,.35);border-radius:2px}
.label small{display:block;font-size:10.5px;letter-spacing:.18em;opacity:.6;margin-bottom:2px}
.label p{margin:0;font-family:var(--hand);font-size:24px;line-height:1.05;text-wrap:balance;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.count{text-align:center;display:flex;flex-direction:column;gap:2px}
.count b{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.count b span{font-size:16px;color:var(--muted);font-weight:400}
.count small{color:var(--muted);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;width:200px;margin:6px auto 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s}

.papers{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.papers h2{margin:0;font-size:14px;font-weight:400;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.papers h2 b{font-family:var(--display);font-size:16px;white-space:nowrap}
.papers h2 span{color:var(--muted);font-size:12.5px}
.stack{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;min-height:56px}
.stack::-webkit-scrollbar{display:none}
.sheet{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:3px;position:relative;
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.18);transition:transform .15s}
.sheet[aria-pressed="true"]{transform:translateY(-5px) rotate(-4deg);box-shadow:inset -6px -6px 0 rgba(0,0,0,.06),0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sheet.rare::after{content:"✦";position:absolute;right:3px;top:1px;font-size:11px;color:rgba(255,255,255,.9)}
.empty{color:var(--muted);font-size:13px;align-self:center;padding:10px 4px}
.selname{font-size:12.5px;color:var(--muted);margin-top:-6px}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn2{border:1px solid var(--line);background:transparent;border-radius:14px;padding:11px 14px;font-size:14px;width:100%;color:var(--ink)}
.btn2:disabled{color:var(--muted);cursor:default}

details.test{border:1px dashed var(--line);border-radius:14px;padding:8px 12px;color:var(--muted);font-size:13px}
details.test summary{cursor:pointer}
.testrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.testrow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}

/* onboarding */
.onboard{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto;padding-block:40px}
.onboard h1{font-family:var(--display);font-size:30px;line-height:1.3;margin:0;text-wrap:balance}
.onboard p{margin:0;color:var(--muted)}
.onboard textarea{width:100%;box-sizing:border-box;min-height:120px;resize:none;border:1px solid var(--line);border-radius:4px;
  background:var(--label);color:var(--label-ink);font-family:var(--hand);font-size:28px;line-height:1.2;padding:16px}
.onboard .hint{font-size:13px}
.minijar{width:120px;height:150px;margin:0 auto}

/* fold overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px, env(safe-area-inset-left,0px))}
.ftop{display:flex;align-items:center;gap:10px;max-width:440px;width:100%;margin:0 auto}
.ftop .x{border:0;background:none;font-size:22px;width:36px;height:36px;border-radius:50%;color:var(--muted)}
.ftop .steps{flex:1;display:flex;gap:4px}
.ftop .steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.ftop .steps i.on{background:var(--accent)}
.mode{font-size:12px;color:var(--muted);white-space:nowrap}
.qbtn{border:1px solid var(--line);background:none;border-radius:50%;width:28px;height:28px;font-size:13px;color:var(--muted)}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#stage{width:min(100%,400px);aspect-ratio:1;touch-action:none;user-select:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage g.world{transition:transform .45s cubic-bezier(.3,.7,.3,1)}
#stage .appear{animation:appear .35s ease-out}
@keyframes appear{from{opacity:.2}}
.guide{max-width:440px;width:100%;margin:0 auto;min-height:92px;display:flex;flex-direction:column;gap:6px;text-align:center}
.guide .num{font-size:12px;letter-spacing:.14em;color:var(--accent)}
.guide .txt{font-family:var(--display);font-size:19px;line-height:1.4;text-wrap:balance;word-break:keep-all}
.guide .sub{font-size:13px;color:var(--muted)}
.guide.quiet .txt{font-family:var(--body);font-size:14px;color:var(--muted)}
.paperchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);align-self:center}
.paperchip i{width:12px;height:12px;border-radius:2px;display:inline-block}
.done{display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;transition:.3s;pointer-events:none;max-width:calc(100% - 48px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,12,24,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px, env(safe-area-inset-right,0px)) 0 max(0px, env(safe-area-inset-left,0px))}
.modal .card{background:var(--surface);width:100%;max-width:460px;border-radius:22px 22px 0 0;max-height:80%;overflow:auto;
  padding:22px max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(20px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-family:var(--display);font-size:20px}
.arch{display:flex;flex-direction:column;gap:12px}
.arch li{list-style:none;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
.arch .strip{width:18px;height:56px;border-radius:4px;overflow:hidden;display:flex;flex-direction:column-reverse;flex:0 0 auto}
.arch .strip i{display:block;flex:1}
.arch .w{font-family:var(--hand);font-size:24px;line-height:1.1;word-break:keep-all}
.arch .d{font-size:12px;color:var(--muted)}
.arch ul{margin:0;padding:0}

.ad{position:fixed;inset:0;z-index:50;background:#0d0e14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.ad b{font-size:20px}
.ad span{opacity:.6;font-size:13px}

.finale{position:fixed;inset:0;z-index:35;background:rgba(10,12,24,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.finale .card{background:var(--surface);border-radius:22px;max-width:380px;width:100%;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.finale h3{margin:0;font-family:var(--display);font-size:22px;text-wrap:balance}
.finale .wish{font-family:var(--hand);font-size:30px;line-height:1.1;background:var(--label);color:var(--label-ink);padding:12px;border-radius:3px;word-break:keep-all}
.finale p{margin:0;color:var(--muted)}
.finale .bless{color:var(--ink);font-family:var(--display);font-size:17px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- native bridge ---------- */
const NATIVE = window.Native || null;
const IS_DEBUG = !NATIVE || (NATIVE.isDebug && NATIVE.isDebug());
function haptic(ms){ try{ if(NATIVE) NATIVE.vibrate(ms); else if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------- data ---------- */
const COLORS = {
  red:{n:'빨강',c:'#DE4A3F',w:8}, orange:{n:'주황',c:'#EF8B2E',w:8}, yellow:{n:'노랑',c:'#F2C531',w:8},
  lime:{n:'연두',c:'#9ACB4C',w:8}, green:{n:'초록',c:'#2F9A60',w:8}, sky:{n:'하늘',c:'#5DB6E4',w:8},
  blue:{n:'파랑',c:'#2F6ED4',w:8}, navy:{n:'남색',c:'#2F3F8E',w:7}, purple:{n:'보라',c:'#7B56C1',w:8},
  pink:{n:'분홍',c:'#EC79AE',w:8}, blush:{n:'연분홍',c:'#F4B8CD',w:7}, mint:{n:'민트',c:'#6AD0BD',w:7},
  gold:{n:'금색',c:'#D3A73A',w:2,rare:1}, silver:{n:'은색',c:'#B9BEC8',w:2,rare:1}
};
const GOAL = 1000, DAILY = 5, AD_BONUS = 5, GUIDED_COUNT = 3;
const MILESTONES = {1:'첫 번째 학이 통에 들어갔어요',10:'열 마리째예요. 통 바닥이 조금씩 채워져요',50:'오십 마리! 꾸준함이 쌓이고 있어요',
  100:'백 마리를 모았어요',200:'이백 마리째예요',300:'삼백 마리, 벌써 3할이에요',500:'절반을 넘었어요. 오백 마리!',
  700:'칠백 마리째예요',900:'천 마리까지 백 마리 남았어요',990:'열 마리만 더 접으면 돼요'};

const KEY = 'cranejar.v1';
let S;
function fresh(){ return {wish:'',wishStart:0,cranes:[],papers:[],lastGrant:'',adDate:'',dayOffset:0,totalFolded:0,archive:[]}; }
function load(){ try{ const j = JSON.parse(localStorage.getItem(KEY)); if(j && typeof j==='object') return Object.assign(fresh(), j);}catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
S = load();

function today(){ const d = new Date(); d.setDate(d.getDate() + (S.dayOffset||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function randColor(){ const ks = Object.keys(COLORS); const tot = ks.reduce((a,k)=>a+COLORS[k].w,0);
  let r = Math.random()*tot; for(const k of ks){ r -= COLORS[k].w; if(r<=0) return k; } return ks[0]; }
function grantDaily(){
  if(!S.wish) return false;
  const t = today(); if(S.lastGrant === t) return false;
  S.lastGrant = t; for(let i=0;i<DAILY;i++) S.papers.push(randColor()); save(); return true;
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }

/* ---------- geometry ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], len=a=>Math.hypot(a[0],a[1]), norm=a=>mul(a,1/len(a));
const side=(p,a,b)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
function clip(poly,a,b,s){
  const out=[], n=poly.length;
  for(let i=0;i<n;i++){
    const cur=poly[i], prev=poly[(i-1+n)%n], dc=side(cur,a,b)*s, dp=side(prev,a,b)*s;
    const X=()=>{ const t=dp/(dp-dc); return [prev[0]+t*(cur[0]-prev[0]), prev[1]+t*(cur[1]-prev[1])]; };
    if(dc>=0){ if(dp<0) out.push(X()); out.push(cur); } else if(dp>=0) out.push(X());
  }
  return out;
}
function area(p){ let s=0; for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s/2); }
const ok = p => p.length>=3 && area(p)>0.6;
function nrm(a,b){ const d=norm(sub(b,a)); return [-d[1],d[0]]; }
function refl(p,a,b,t){ const n=nrm(a,b), d=dot(sub(p,a),n); return sub(p, mul(n,2*t*d)); }
function rot(p,c,ang){ const s=Math.sin(ang), co=Math.cos(ang), x=p[0]-c[0], y=p[1]-c[1]; return [c[0]+x*co-y*s, c[1]+x*s+y*co]; }
function bbox(state){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; state.forEach(p=>p.pts.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);})); return {x0,y0,x1,y1}; }
function centroid(pts){ let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1];}); return [x/pts.length,y/pts.length]; }
const P = (pts,shade=0,tag='p')=>({pts,shade,tag,back:false});

/* ---------- crane folding sequence ---------- */
const E=[97.3,112.8], E2=[202.7,112.8], N=[150,-14.4], B=[150,240], F=[115.8,68.2], F2=[184.2,68.2], M=[150,100], C=[150,112.8];
const S0=[P([[150,30],[270,150],[150,270],[30,150]])];
const SB=[P([[150,60],[150,240],[60,150]],0), P([[150,60],[240,150],[150,240]],.07)];
const BB=[P([N,C,E],0), P([N,E2,C],.07), P([E,C,B],.03), P([C,E2,B],.1)];
const NS=[P([N,M,F],0,'wingL'), P([N,F2,M],.07,'wingR'), P([F,M,B],.03,'legL'), P([M,F2,B],.1,'legR')];
const n1=norm(sub(B,[142,135])), t1=norm([-0.62,-0.78]), d1=add(n1,t1);
const NECK_A=[142,135], NECK_B=add(NECK_A,mul(d1,60));
const TAIL_A=[158,135], TAIL_B=add(TAIL_A,mul([-d1[0],d1[1]],60));
const TIP=refl(B,NECK_A,NECK_B,1), U=norm(sub(TIP,NECK_A)), Q=sub(TIP,mul(U,24)), HD=add(U,norm([-0.92,0.4]));
const QB=sub(Q,mul(U,9));

// finished crane, seen from the side (wings up, neck with bent head on the left, tail on the right)
const SIDE=[
  P([[128,184],[192,186],[224,72]],.2,'farWing'),
  P([[182,200],[200,193],[266,92]],.12,'tail'),
  P([[96,198],[150,180],[150,218]],.04,'body'),
  P([[150,180],[208,196],[150,218]],.13,'body'),
  P([[102,199],[122,204],[54,84]],.07,'neck'),
  P([[54,84],[63,90],[30,100]],0,'head'),
  P([[104,190],[150,56],[132,190]],.09,'wing'),
  P([[132,190],[150,56],[178,190]],0,'wing')
];
const STEPS=[
  {t:'색종이를 대각선으로 반 접어 세모를 만들어요', folds:[{a:[0,150],b:[300,150],toward:[150,60]}]},
  {t:'세모를 한 번 더 반으로 접어요', folds:[{a:[150,0],b:[150,300],toward:[60,180]}]},
  {t:'윗장을 들어 펼친 뒤 눌러서 네모로 만들어요', s:'뒷장도 같은 방법으로 네모가 돼요', folds:[{a:[150,150],b:[210,210],toward:[240,160]}], after:SB},
  {t:'아래 양옆 모서리를 가운데 선에 맞춰 접어요', s:'한쪽만 끌어도 양쪽이 같이 접혀요', folds:[{a:B,b:E,toward:[60,150]},{a:B,b:E2,toward:[240,150]}]},
  {t:'아래 꼭짓점을 위로 들어 올려 길게 펼쳐 접어요', s:'꽃잎 접기라고 불러요', folds:[{a:[0,112.8],b:[300,112.8],toward:[150,230]}], keepBehind:true},
  {t:'종이를 뒤집어요', s:'반대쪽도 같은 모양으로 접혀요', flip:true, after:BB},
  {t:'아래쪽 양옆을 가운데 선에 맞춰 가늘게 접어요', folds:[{a:B,b:F,toward:E},{a:B,b:F2,toward:E2}], after:NS},
  {t:'왼쪽 다리를 안쪽으로 접어 올려 목을 만들어요', folds:[{a:NECK_A,b:NECK_B,toward:B}], only:['legL']},
  {t:'오른쪽 다리도 접어 올려 꼬리를 만들어요', folds:[{a:TAIL_A,b:TAIL_B,toward:B}], only:['legR']},
  {t:'목 끝을 살짝 접어 머리를 만들어요', folds:[{a:Q,b:add(Q,mul(HD,40)),toward:TIP,bound:{a:QB,b:add(QB,[-U[1],U[0]]),toward:TIP}}], only:['legL']},

function prepare(state, step){

    return {stat,mov,arrows:[{from:[cx-(bb.x1-bb.x0)*.42,cy+20],to:[cx+(bb.x1-bb.x0)*.42,cy+20]}],lines:[[f.a,f.b]]};

  if(step.rotate){

  } else {
    for(const p of state){
      if(step.only && !step.only.includes(p.tag)){ stat.push(p); continue; }
      let rest=[p.pts];
      step.folds.forEach((f,fi)=>{
        const s=Math.sign(side(f.toward,f.a,f.b)), next=[];

  const groups={};
  mov.forEach(m=>{ (groups[m.f.key]=groups[m.f.key]||{f:m.f,pts:[]}).pts.push(...m.p.pts); });
  const arrows=[], lines=[];
  Object.values(groups).forEach(g=>{ const c=centroid(g.pts); arrows.push({from:c,to:movePt(c,g.f,1)}); if(g.f.type==='r') lines.push([g.f.a,g.f.b]); });

  const movOut=[];
  prep.mov.forEach(m=>{

}

const JW=300, JH=450, IN={x0:30,x1:270,floor:430}, R=3.85;

    const rng=mulberry(rng0*7+i*7919);
    const W=IN.x1-IN.x0; let best=null;

}

function pieceSvg(p,col){ return `<path d="M${p.pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')}Z" fill="${shadeCol(col,p.shade,p.back)}" stroke="${edgeCol(col)}" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`; }

function drawGuides(){

  const sw=1/F_.scale, acc=cssv('--accent'), showHand=guided()||F_.help;
  let h='';
  F_.prep.lines.forEach(([a,b])=>{
    const bb=bbox(F_.state), pad=26;
    // clip long line to bbox+pad
    const d=norm(sub(b,a)); let ts=[];
    const box=[bb.x0-pad,bb.y0-pad,bb.x1+pad,bb.y1+pad];

    const path=`M${from[0]} ${from[1]} Q${ctrl[0]} ${ctrl[1]} ${to[0]} ${to[1]}`;
    h+=`<path d="${path}" fill="none" stroke="${acc}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" opacity=".9"/>`;
    h+=`<path d="M${left[0]} ${left[1]}L${to[0]} ${to[1]}L${right[0]} ${right[1]}" fill="none" stroke="${acc}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(showHand && !matchMedia('(prefers-reduced-motion: reduce)').matches) h+=`<circle r="${11*sw}" fill="${acc}" opacity=".35"><animateMotion dur="1.7s" repeatCount="indefinite" path="${path}" keyPoints="0;1;1" keyTimes="0;.75;1" calcMode="linear"/></circle>`;
  });
  g.innerHTML=h;
}
function renderSteps(){ $('#fsteps').innerHTML=STEPS.map((_,i)=>`<i class="${i<F_.step||F_.done?'on':''}"></i>`).join(''); }
function renderGuide(){
  const gd=guided(), el=$('#fguide'), q=$('#fq'), col=COLORS[F_.key];
  $('#fmode').textContent = gd ? `안내 모드 · ${S.totalFolded+1}번째` : '빠른 접기';
  q.hidden = gd || F_.done;
  if(F_.done){ el.className='guide'; el.innerHTML=''; return; }
  const st=STEPS[F_.step], chip=`<span class="paperchip"><i style="background:${col.c}"></i>${col.n} 색종이</span>`;
  if(gd||F_.help){
    el.className='guide';
    el.innerHTML=`<span class="num">${F_.step+1} / ${STEPS.length}단계</span><span class="txt">${st.t}</span>${st.s?`<span class="sub">${st.s}</span>`:''}${gd&&F_.step===0?'<span class="sub">점선을 기준으로 화살표 방향으로 종이를 끌어주세요</span>':''}`;
  } else {
    el.className='guide quiet'; el.innerHTML=`<span class="txt">${F_.step+1} / ${STEPS.length}</span>${chip}`;
  }
}
let drag=null;
function onDown(e){ if(!F_||F_.done||!F_.prep) return; drag={x:e.clientX,y:e.clientY}; e.currentTarget.setPointerCapture(e.pointerId); }
function onMove(e){
  if(!drag) return;
  const rect=$('#stage').getBoundingClientRect(), k=300/rect.width/F_.scale;
  const d=[(e.clientX-drag.x)*k,(e.clientY-drag.y)*k];
  let p=0; F_.prep.arrows.forEach(a=>{ const v=sub(a.to,a.from), vv=dot(v,v); if(vv>1) p=Math.max(p,dot(d,v)/vv); });
  F_.t=Math.max(0,Math.min(1,p*1.15)); drawPaper();
}
function onUp(){ if(!drag) return; drag=null; if(F_.t>0.45) finishStep(); else animateT(0); }
function animateT(target,cb){
  const from=F_.t, t0=performance.now(), dur=Math.max(120,Math.abs(target-from)*380);
  const f=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); F_.t=from+(target-from)*e; drawPaper(); if(k<1) requestAnimationFrame(f); else cb&&cb(); };
  requestAnimationFrame(f);
}
function finishStep(){
  const step=STEPS[F_.step];
  animateT(1,()=>{
    F_.state=result(F_.state,step); F_.step++;
    haptic(12);
    if(F_.step>=STEPS.length){ completeCrane(); return; }
    beginStep(); drawPaper(!!step.after);
  });
}
function completeCrane(){
  F_.done=true; F_.prep=null;
  const fit=fitTransform(F_.state); F_.scale=fit.s; $('#world').style.transform=fit.str;
  drawPaper(true); drawGuides(); renderSteps(); renderGuide();
  const n=S.cranes.length+1, col=COLORS[F_.key];
  const el=$('#fguide'); el.className='done';
  el.innerHTML=`<div class="guide"><span class="num">완성</span><span class="txt">${n}번째 학을 접었어요</span><span class="sub">${col.n} 학${col.rare?' · 드물게 나오는 색이에요':''}</span></div><button class="btn" id="putBtn">통에 넣기</button>`;
  $('#putBtn').onclick=putInJar; $('#putBtn').focus();
}
function putInJar(){
  const {idx,key}=F_;
  haptic(30);
  S.papers.splice(idx,1); S.cranes.push(key); S.totalFolded++; save();
  const n=S.cranes.length, wasGuided=S.totalFolded===GUIDED_COUNT;
  closeFold(); selected=0; renderHome(); setupJar(true);
  setTimeout(()=>{
    if(n>=GOAL) return showFinale();
    if(MILESTONES[n]) toast(MILESTONES[n]); else if(wasGuided) toast('이제 익숙해졌죠? 다음부터는 빠른 접기로 접어요');
  },950);
}

/* ---------- ad, archive, finale ---------- */
function grantAd(){ S.adDate=today(); for(let i=0;i<AD_BONUS;i++) S.papers.push(randColor()); save(); renderHome(); toast(`색종이 ${AD_BONUS}장을 더 받았어요`); }
let adBusy=false;
window.onAdResult=function(ok){
  adBusy=false; const b=$('#adBtn'); if(b){ b.disabled=false; b.textContent=`광고 보고 색종이 ${AD_BONUS}장 더 받기`; }
  if(ok==='reward') grantAd();
  else if(ok==='unavailable') toast('광고를 불러오지 못했어요. 잠시 후 다시 눌러주세요');
  else if(ok==='closed') toast('광고를 끝까지 보면 색종이를 받을 수 있어요');
};
function showAd(){
  if(S.adDate===today()||adBusy) return;
  if(NATIVE){ adBusy=true; const b=$('#adBtn'); if(b){ b.disabled=true; b.textContent='광고를 불러오는 중이에요'; } NATIVE.showRewardedAd(); return; }
  const a=document.createElement('div'); a.className='ad'; a.innerHTML=`<b>광고 영역</b><span>미리보기라 실제 광고 대신 3초 기다려요</span><span id="adc">3</span>`;
  document.body.appendChild(a); let c=3;
  const iv=setInterval(()=>{ c--; const el=$('#adc'); if(el) el.textContent=c; if(c<=0){ clearInterval(iv); a.remove(); grantAd(); } },1000);
}
function strip(cr){ const n=cr.length, k=Math.max(1,Math.round(n/20)), out=[]; for(let i=0;i<n;i+=k) out.push(`<i style="background:${COLORS[cr[i]].c}"></i>`); return out.join(''); }
function fmt(ts){ const d=new Date(ts); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
function showArchive(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card" role="dialog" aria-label="소원 보관함"><h3>소원 보관함</h3>
    ${S.archive.length?`<ul class="arch">${S.archive.slice().reverse().map(a=>`<li><span class="strip">${strip(a.cranes)}</span><div><div class="w">${esc(a.wish)}</div><div class="d">${fmt(a.start)} ~ ${fmt(a.end)} · 학 ${a.cranes.length}마리</div></div></li>`).join('')}</ul>`
      :`<p style="margin:0;color:var(--muted)">아직 완성한 소원이 없어요. 학 천 마리를 모으면 그 소원 통이 이곳에 보관돼요.</p>`}
    <button class="btn2" id="mClose">닫기</button></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) m.remove(); }; $('#mClose').onclick=()=>m.remove();
}
function showFinale(){
  const f=document.createElement('div'); f.className='finale';
  f.innerHTML=`<div class="card" role="dialog" aria-label="천 마리 완성"><h3>종이학 천 마리를 모두 접었어요</h3>
    <div class="wish">${esc(S.wish)}</div><p class="bless">당신의 소원이 성취되길 바랍니다.</p>
    <p>${fmt(S.wishStart)}부터 ${S.cranes.length}마리를 접었어요. 이 통은 소원 보관함에 남겨둘게요.</p>
    <button class="btn" id="newWish">새 소원 적기</button><button class="btn2" id="stay">통 조금 더 보기</button></div>`;
  document.body.appendChild(f);
  $('#stay').onclick=()=>{ f.remove(); const b=$('#foldBtn'); if(b){ b.textContent='새 소원 적기'; b.disabled=false; b.onclick=archiveAndRestart; } };
  $('#newWish').onclick=()=>{ f.remove(); archiveAndRestart(); };
}
function archiveAndRestart(){
  S.archive.push({wish:S.wish,start:S.wishStart,end:Date.now(),cranes:S.cranes}); S.wish=''; S.cranes=[]; layout=[]; save(); renderOnboard(true);
}

/* ---------- back button (called by the app) ---------- */
window.onBackPressed=function(){
  const m=document.querySelector('.modal'); if(m){ m.remove(); return true; }
  if($('#fold')){ closeFold(); return true; }
  return false;
};

/* ---------- boot ---------- */
if(S.wish){ const g=grantDaily(); renderHome(); if(S.cranes.length>=GOAL) setTimeout(showFinale,400); else if(g) setTimeout(()=>toast('오늘의 색종이 5장이 도착했어요'),500); }
else renderOnboard(false);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.wish && !F_ && grantDaily()){ renderHome(); toast('오늘의 색종이 5장이 도착했어요'); } });
</script>

</body>
</html>
