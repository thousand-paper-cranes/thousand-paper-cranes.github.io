# XcodeGen 설정. GitHub Actions(macOS)에서 `xcodegen generate`로 ThousandCranes.xcodeproj를 만든다.
# 앱 화면은 Android와 같은 android/app/src/main/assets/www 를 그대로 묶어 넣는다.
name: ThousandCranes
options:
  bundleIdPrefix: com.ohsang.util
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
targets:
  ThousandCranes:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../android/app/src/main/assets/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohsang.util.thousandcranes
        PRODUCT_NAME: ThousandCranes
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 워크플로가 Variables로 덮어쓴다. 기본값은 Google 테스트 광고
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
    dependencies:
      - package: GoogleMobileAds
      - target: CraneWidget
  CraneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohsang.util.thousandcranes.widget
        PRODUCT_NAME: CraneWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  ThousandCranes:
    build:
      targets:
        ThousandCranes: all
        CraneWidget: all
    archive:
      config: Release
