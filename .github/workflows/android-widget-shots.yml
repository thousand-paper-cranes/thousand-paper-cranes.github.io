name: Android 위젯 그림 확인

# 디버그 APK를 에뮬레이터에 깔고 위젯 그림을 PNG로 뽑아 android-shots 브랜치에 올린다.
on:
  push:
    branches: [main]
    paths: ["android/app/src/main/java/**/widget/**", "android/app/src/debug/**", ".github/workflows/android-widget-shots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 디버그 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 위젯 그림 뽑기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am broadcast -a com.ohsang.util.thousandcranes.WIDGET_SHOT -n com.ohsang.util.thousandcranes/.WidgetShotReceiver
            sleep 4
            adb pull /sdcard/Android/data/com.ohsang.util.thousandcranes/files/shots shots
            ls -la shots
      - name: android-shots 브랜치에 올리기
        run: |
          cd shots
          git init -q && git checkout -q -b android-shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android 위젯 그림 ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-shots
